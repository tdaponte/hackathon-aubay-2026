<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #34495e;
        }
        .char-limit {
            font-weight: normal;
            font-size: 0.85em;
            color: #7f8c8d;
            float: right;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        textarea {
            resize: vertical;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>User Profile Registration</h1>
    <form action="#" method="POST">

        <!-- Basic User Details -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="john.doe@example.com">
        </div>

        <!-- Description Fields with Maximum Character Sizes in Labels -->
        <div class="form-group">
            <label for="shortBio">
                Short Biography
                <span class="char-limit">(Max 150 characters)</span>
            </label>
            <textarea id="shortBio" name="shortBio" rows="3" maxlength="150" placeholder="Tell us a little bit about yourself..."></textarea>
        </div>

        <div class="form-group">
            <label for="projectDesc">
                Project Description
                <span class="char-limit">(Max 500 characters)</span>
            </label>
            <textarea id="projectDesc" name="projectDesc" rows="6" maxlength="500" placeholder="Describe the main objectives and scope of your project..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit Details</button>
    </form>
</div>

</body>
</html>
