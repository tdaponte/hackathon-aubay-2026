[project]
name = "ateliers-du-quartier"
version = "0.1.0"
description = "Site fictif du hackathon : parcours d'inscription avec obstacles cognitifs."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.5,<4",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
